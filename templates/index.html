<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Alternatives{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sanchez:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>

      /* Fixed right navigation */
      .nav-sidebar {
        position:fixed;
        right:3vw;
        top:3vh;
        display:flex;
        flex-direction:column;
        gap:1.2rem;
        z-index:1000;
      }
      .nav-link {
        background:#a89aa8;
        color:#fff;
        padding:0.9em 2em;
        border-radius:999px;
        text-decoration:none;
        font-family:'League Spartan',sans-serif;
        font-weight:600;
        font-size:1rem;
        transition:all 0.3s ease;
        text-align:center;
        box-shadow:0 4px 15px rgba(0,0,0,0.1);
      }
      .nav-link:hover {
        background:#9a8ca0;
        transform:translateX(-10px);
      }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
  <!-- Right side navigation -->
  <nav class="nav-sidebar">
    <a href="/" class="nav-link">HOME</a>
    <a href="/research" class="nav-link">RESEARCH</a>
    <a href="/about" class="nav-link">ABOUT</a>
    <a href="/contact" class="nav-link">CONTACT</a>
    <a href="/work" class="nav-link">WORK</a>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>
  
  <footer style="text-align:center;padding:2.2rem 0 1.2rem 0;font-size:1rem;background:#64192F;color:#fff;border-top:none;margin-top:0;">
    © 2025 – Projet Alternatives | Développement durable & innovation
  </footer>
</body>
</html>
